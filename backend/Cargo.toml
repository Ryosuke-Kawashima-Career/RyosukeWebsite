[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"
uuid = { version = "1.29.2", features = ["serde", "v4"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
